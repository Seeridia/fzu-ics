# 自动拉取教务系统课表，并更新到指定的 Gist。
#
# 需要配置的 Repository Secrets:
#   FZU_ID        学号
#   FZU_PASSWORD  教务系统密码
#   GIST_TOKEN    经典版 (classic) Personal Access Token，需勾选 gist 权限
#                 （注意：细粒度 fine-grained 令牌不支持 Gist API）
#   GIST_ID       目标 Gist 的 ID，即 https://gist.github.com/<user>/<这一串>
# 可选的 Repository Variables:
#   FZU_TERM        要导出的学期，默认 all
#   GIST_FILENAME   生成及上传到 Gist 的文件名，默认 福州大学课程表 [学号] (学期).ics

name: Update calendar gist

on:
  workflow_dispatch:
    inputs:
      term:
        description: "要导出的学期 (all)"
        default: all
  schedule:
    - cron: "0 2 * * *" # 每天 UTC 02:00（北京时间 10:00）

permissions:
  contents: read

concurrency:
  group: update-gist
  cancel-in-progress: true

jobs:
  update-gist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FZU_ID: ${{ secrets.FZU_ID }}
      FZU_PASSWORD: ${{ secrets.FZU_PASSWORD }}
      FZU_TERM: ${{ inputs.term || vars.FZU_TERM || 'all' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 生成课程表
        env:
          GIST_FILENAME: ${{ vars.GIST_FILENAME }}
        run: |
          export FZU_OUTPUT="${GIST_FILENAME:-福州大学课程表 [${FZU_ID}] (${FZU_TERM}).ics}"

          go run main.go

          test -f "$FZU_OUTPUT"
          echo "ICS_FILE=$FZU_OUTPUT" >> "$GITHUB_ENV"

      - name: 更新 Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          jq -n \
            --arg name "$ICS_FILE" \
            --rawfile content "$ICS_FILE" \
            --arg desc "福州大学课程表 [${FZU_ID}]，自动更新于 $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" \
            '{description: $desc, files: {($name): {content: $content}}}' \
            > payload.json

          url=$(curl -sf -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/$GIST_ID" \
            -d @payload.json | jq -r '.html_url')

          echo "已更新 Gist: $url"
          echo "[已更新 Gist]($url)" >> "$GITHUB_STEP_SUMMARY"
